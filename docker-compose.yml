# AgentForge — one image, one container.
#
# Everything else (API keys, endpoints, models, upload limits) is configured in
# the web UI at http://localhost:3000/settings and stored in the database.
#
#   docker compose up -d --build
#
# Reusing services you already run:
#   * PostgreSQL — uncomment DATABASE_URL below and join its network.
#   * Redis      — uncomment REDIS_URL below; needed only if you run more than
#                  one uvicorn worker, so the API-key rate limiter is shared.
# Neither is required: the defaults use SQLite and an in-process limiter.

services:
  agentforge:
    build:
      context: .
      dockerfile: Dockerfile
    image: agentforge:latest
    container_name: agentforge
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - ENV=${ENV:-production}
      - DEBUG=${DEBUG:-False}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

      # Storage. Swap in your own PostgreSQL:
      #   DATABASE_URL=postgresql+asyncpg://user:password@postgres:5432/agentforge
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./data/agentforge.db}
      - CHROMA_PERSIST_DIRECTORY=/app/data/chroma_data

      # Optional Redis for the public-API rate limiter:
      #   REDIS_URL=redis://redis:6379/0
      - REDIS_URL=${REDIS_URL:-}

      # Empty accepts any origin, which the embeddable widget needs.
      - CORS_ORIGINS=${CORS_ORIGINS:-}

      # Generated under /app/data on first run if unset.
      - SECRET_KEY=${SECRET_KEY:-}

      # Behind your own reverse proxy: "127.0.0.1,<proxy address>" (keep 127.0.0.1,
      # the in-container nginx), so sign-in limits apply per visitor.
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-127.0.0.1}

      # Optional: create the admin without the setup link printed in the logs.
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    extra_hosts:
      # Lets the container reach an Ollama daemon running on the host (Linux).
      # Configure the endpoint itself in Settings: http://host.docker.internal:11434
      - "host.docker.internal:host-gateway"
    volumes:
      # SQLite file, Chroma vectors and the settings key all live under /app/data,
      # so a single volume carries the whole state.
      - agentforge-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=5).status == 200 else 1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # To reach a PostgreSQL/Redis that lives on another compose project's network,
    # attach to it here and set the URLs above to their service names:
    #
    # networks:
    #   - default
    #   - shared
    #
    # networks:
    #   shared:
    #     external: true
    #     name: <the other project's network, e.g. tp2_backend-net>

volumes:
  agentforge-data:
    driver: local
