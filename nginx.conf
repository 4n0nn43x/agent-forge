server {
    listen 3000;
    server_name _;

    # Increase buffer sizes for large requests
    client_max_body_size 100M;
    client_body_buffer_size 128k;

    # Frontend static files
    root /var/www/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # $host drops the port, and FastAPI builds redirect Location headers from the
    # Host header — so a 307 on a trailing-slash path pointed the browser at
    # http://<host>/... on port 80, where nothing listens. Every redirecting
    # endpoint (delete an API key, toggle a webhook, the whole first-run flow)
    # failed in the container while working under the Vite dev proxy.
    # $http_host keeps the port, so redirects come back to the right place.
    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
        proxy_buffering off;
    }

    # API docs
    location /docs {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OpenAPI schema
    location /openapi.json {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $http_host;
        access_log off;
    }

    # SPA routing - serve index.html for all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
